services:
  - type: web
    name: shop-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn database:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: shop-db
          property: connectionString

databases:
  - name: shop-db
    plan: free
    databaseName: shop
    user: shop
